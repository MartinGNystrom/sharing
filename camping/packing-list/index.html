<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Camping packing list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fg:#16181d;--muted:#5d6470;--bg:#fff;--card:#f5f7fb;--line:#e3e7ef;--accent:#2C5FD1}
@media (prefers-color-scheme:dark){:root{--fg:#e8eaf0;--muted:#9aa2b1;--bg:#111318;--card:#1a1d24;--line:#2a2f3a;--accent:#6C97F2}}
*{box-sizing:border-box}body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.45}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:.2em 0}.intro{color:var(--muted);margin:0 0 12px}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;z-index:2}
.prog{flex:1;height:8px;background:var(--card);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px}
section{background:var(--card);border-radius:12px;padding:6px 14px 8px;margin:14px 0}
h2{font-size:1.05rem;margin:10px 0 4px;display:flex;justify-content:space-between}.count{color:var(--muted);font-weight:400;font-size:.9rem}
ul{list-style:none;margin:0;padding:0}li{border-top:1px solid var(--line)}li:first-child{border-top:0}
label{display:flex;gap:12px;align-items:flex-start;padding:11px 0;cursor:pointer}
input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
input:checked+span{color:var(--muted);text-decoration:line-through}
footer{color:var(--muted);font-size:.8rem;margin-top:24px}
</style></head><body><main>
<h1>Camping packing list</h1><p class="intro">Martin + Eli overnight camping trip. Tap to check items off.</p>
<div class="bar"><div class="prog"><i id="p"></i></div><span id="c">0/34</span><button id="r">Reset</button></div>
<section><h2>Shelter &amp; sleep <span class="count" data-sec="shelter-sleep"></span></h2><ul><li><label><input type="checkbox" data-k="shelter-sleep--tent" data-sec="shelter-sleep"><span>Tent</span></label></li><li><label><input type="checkbox" data-k="shelter-sleep--tarp" data-sec="shelter-sleep"><span>Tarp</span></label></li><li><label><input type="checkbox" data-k="shelter-sleep--two-sleeping-bags" data-sec="shelter-sleep"><span>Two sleeping bags</span></label></li><li><label><input type="checkbox" data-k="shelter-sleep--pillows" data-sec="shelter-sleep"><span>Pillows</span></label></li><li><label><input type="checkbox" data-k="shelter-sleep--air-mattress-for-eli" data-sec="shelter-sleep"><span>Air mattress for Eli</span></label></li><li><label><input type="checkbox" data-k="shelter-sleep--air-mattress-pump" data-sec="shelter-sleep"><span>Air mattress pump</span></label></li><li><label><input type="checkbox" data-k="shelter-sleep--electric-blanket-runs-off-the-truck-outlets-pack-with-the-power-cords" data-sec="shelter-sleep"><span>Electric blanket (runs off the truck outlets; pack with the power cords)</span></label></li></ul></section><section><h2>Food &amp; drink <span class="count" data-sec="food-drink"></span></h2><ul><li><label><input type="checkbox" data-k="food-drink--cooler-regular-ice-cooler" data-sec="food-drink"><span>Cooler (regular ice cooler)</span></label></li><li><label><input type="checkbox" data-k="food-drink--ice-buy-day-of" data-sec="food-drink"><span>Ice (buy day of)</span></label></li><li><label><input type="checkbox" data-k="food-drink--cold-drinks" data-sec="food-drink"><span>Cold drinks</span></label></li><li><label><input type="checkbox" data-k="food-drink--coffee" data-sec="food-drink"><span>Coffee</span></label></li><li><label><input type="checkbox" data-k="food-drink--brewer" data-sec="food-drink"><span>Brewer</span></label></li><li><label><input type="checkbox" data-k="food-drink--mug" data-sec="food-drink"><span>Mug</span></label></li><li><label><input type="checkbox" data-k="food-drink--instant-coffee" data-sec="food-drink"><span>Instant coffee</span></label></li><li><label><input type="checkbox" data-k="food-drink--water-bottles" data-sec="food-drink"><span>Water bottles</span></label></li><li><label><input type="checkbox" data-k="food-drink--hank-s-protein-bars" data-sec="food-drink"><span>Hank&#x27;s protein bars</span></label></li><li><label><input type="checkbox" data-k="food-drink--s-mores-graham-crackers" data-sec="food-drink"><span>S&#x27;mores: graham crackers</span></label></li><li><label><input type="checkbox" data-k="food-drink--s-mores-marshmallows" data-sec="food-drink"><span>S&#x27;mores: marshmallows</span></label></li><li><label><input type="checkbox" data-k="food-drink--s-mores-chocolate-bars" data-sec="food-drink"><span>S&#x27;mores: chocolate bars</span></label></li><li><label><input type="checkbox" data-k="food-drink--s-mores-roasting-sticks" data-sec="food-drink"><span>S&#x27;mores: roasting sticks</span></label></li></ul></section><section><h2>Fire <span class="count" data-sec="fire"></span></h2><ul><li><label><input type="checkbox" data-k="fire--lighter" data-sec="fire"><span>Lighter</span></label></li><li><label><input type="checkbox" data-k="fire--cash-for-firewood-buy-wood-locally" data-sec="fire"><span>Cash for firewood (buy wood locally)</span></label></li></ul></section><section><h2>Hiking <span class="count" data-sec="hiking"></span></h2><ul><li><label><input type="checkbox" data-k="hiking--hiking-poles" data-sec="hiking"><span>Hiking poles</span></label></li><li><label><input type="checkbox" data-k="hiking--hiking-backpack" data-sec="hiking"><span>Hiking backpack</span></label></li><li><label><input type="checkbox" data-k="hiking--headlamps" data-sec="hiking"><span>Headlamps</span></label></li></ul></section><section><h2>Power <span class="count" data-sec="power"></span></h2><ul><li><label><input type="checkbox" data-k="power--portable-fan" data-sec="power"><span>Portable fan</span></label></li><li><label><input type="checkbox" data-k="power--power-cords" data-sec="power"><span>Power cords</span></label></li><li><label><input type="checkbox" data-k="power--usb-cords" data-sec="power"><span>USB cords</span></label></li><li><label><input type="checkbox" data-k="power--lightning-cord" data-sec="power"><span>Lightning cord</span></label></li></ul></section><section><h2>Weather <span class="count" data-sec="weather"></span></h2><ul><li><label><input type="checkbox" data-k="weather--rain-jackets-or-ponchos-both-of-us" data-sec="weather"><span>Rain jackets or ponchos (both of us)</span></label></li></ul></section><section><h2>Camp <span class="count" data-sec="camp"></span></h2><ul><li><label><input type="checkbox" data-k="camp--trash-bag" data-sec="camp"><span>Trash bag</span></label></li><li><label><input type="checkbox" data-k="camp--bag-for-muddy-shoes-and-gear" data-sec="camp"><span>Bag for muddy shoes and gear</span></label></li><li><label><input type="checkbox" data-k="camp--dry-bag-or-2-extra-heavy-duty-trash-bags-for-packing-a-wet-tent-and-rain-fly" data-sec="camp"><span>Dry bag or 2 extra heavy-duty trash bags (for packing a wet tent and rain fly)</span></label></li></ul></section><section><h2>Before you leave <span class="count" data-sec="before-you-leave"></span></h2><ul><li><label><input type="checkbox" data-k="before-you-leave--inflate-eli-s-air-mattress-and-leave-it-overnight-to-check-for-leaks" data-sec="before-you-leave"><span>Inflate Eli&#x27;s air mattress and leave it overnight to check for leaks</span></label></li></ul></section>
<footer>Updated Oct 1, 2026 7:40 AM ET. Checkmarks are saved on this device only.</footer>
</main><script>
const K="camping-packing-v1",s=JSON.parse(localStorage.getItem(K)||"{}"),bs=[...document.querySelectorAll("input[data-k]")];
function upd(){let n=0;const per={};bs.forEach(b=>{per[b.dataset.sec]=per[b.dataset.sec]||[0,0];per[b.dataset.sec][1]++;if(b.checked){n++;per[b.dataset.sec][0]++}});
document.getElementById("c").textContent=n+"/"+bs.length;document.getElementById("p").style.width=(100*n/bs.length)+"%";
document.querySelectorAll(".count").forEach(e=>{const v=per[e.dataset.sec];e.textContent=v?v[0]+"/"+v[1]:""})}
bs.forEach(b=>{b.checked=!!s[b.dataset.k];b.addEventListener("change",()=>{s[b.dataset.k]=b.checked;localStorage.setItem(K,JSON.stringify(s));upd()})});
document.getElementById("r").onclick=()=>{if(confirm("Uncheck everything?")){bs.forEach(b=>b.checked=false);localStorage.removeItem(K);for(const k in s)delete s[k];upd()}};upd();
</script></body></html>
